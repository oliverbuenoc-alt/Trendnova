<!DOCTYPE html><html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>WIN STORE Premium</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
body{background:#f5f5f5}
.product:hover{transform:translateY(-8px);transition:.3s}
.hero{background:linear-gradient(135deg,#111,#222,#444)}
</style>
</head>
<body>
<div class='bg-black text-white text-center py-2'>🚚 Envío gratis | Pago seguro | Devolución 30 días</div>
<nav class='bg-white p-5 shadow flex justify-between sticky top-0'>
<h1 class='font-bold text-2xl'>WIN STORE</h1>
<button onclick='verCarrito()' class='bg-black text-white px-5 py-2 rounded-xl'>🛒 Carrito (<span id='contador'>0</span>)</button>
</nav>
<section class='hero text-white p-12'>
<h1 class='text-6xl font-bold'>Productos virales & Gaming 2026</h1>
<p class='mt-3 text-gray-300'>Dropshipping, setup, hogar y gadgets top ventas</p>
</section>
<div class='max-w-7xl mx-auto p-8'>
<div id='productos' class='grid md:grid-cols-4 gap-6'></div>
</div>
<script>
let carrito=[]
const lista=[
{nombre:'Mini Proyector Smart',precio:49,img:'https://images.unsplash.com/photo-1545239351-1141bd82e8a6?w=500'},
{nombre:'Smartwatch Ultra',precio:69,img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'},
{nombre:'Teclado RGB Gaming',precio:59,img:'https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=500'},
{nombre:'Silla Gaming Pro',precio:129,img:'https://images.unsplash.com/photo-1598550476439-6847785fcea6?w=500'},
{nombre:'Cafetera Espresso',precio:89,img:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500'},
{nombre:'Mini Impresora Bluetooth',precio:29,img:'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500'},
{nombre:'Pack LEDs Setup',precio:24,img:'https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?w=500'},
{nombre:'Ratón Gaming RGB',precio:35,img:'https://images.unsplash.com/photo-1527814050087-3793815479db?w=500'}
]
const productos=document.getElementById('productos')
lista.forEach(p=>{
productos.innerHTML+=`<div class='product bg-white rounded-3xl shadow-xl overflow-hidden'>
<img src='${p.img}' class='h-60 w-full object-cover'>
<div class='p-5'>
<span class='bg-red-500 text-white px-3 py-1 rounded-full'>HOT 🔥</span>
<h2 class='font-bold text-xl mt-3'>${p.nombre}</h2>
<p class='text-3xl font-bold mt-2'>${p.precio}€</p>
<p>⭐⭐⭐⭐⭐ (2.4k)</p>
<button onclick="comprar('${p.nombre}',${p.precio})" class='w-full bg-black text-white p-3 rounded-xl mt-4'>Añadir al carrito</button>
<button onclick='checkout()' class='w-full bg-yellow-400 p-3 rounded-xl mt-2'>Comprar ahora</button>
</div></div>`
})
function comprar(nombre,precio){carrito.push({nombre,precio});contador.innerText=carrito.length}
function verCarrito(){alert(carrito.map(x=>x.nombre+' - '+x.precio+'€').join('\n')||'Carrito vacío')}
function checkout(){window.location.href='https://paypal.com'}
</script>
</body>
</html>
