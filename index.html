<!DOCTYPE html><html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>NEXORA</title>
<script src='https://cdn.tailwindcss.com'></script>
<style>
body{background:#eef2f7;scroll-behavior:smooth}
.hero{background:linear-gradient(135deg,#ff6b00,#ff8c00,#ffb347)}
.product:hover{transform:translateY(-6px);transition:.3s}
</style>
</head>
<body>
<div class='bg-orange-600 text-white text-center py-2'>⚡ Ofertas del día · 🚚 Envío rápido · 💳 Pago seguro</div>
<nav class='bg-white sticky top-0 shadow p-4 flex justify-between items-center z-50'>
<h1 class='font-bold text-3xl text-orange-600'>NEXORA</h1>
<div class='flex gap-4 overflow-auto'>
<a href='#pc'>PC</a>
<a href='#gaming'>Gaming</a>
<a href='#cafe'>Café</a>
<a href='#mascotas'>Mascotas</a>
<a href='#gadgets'>Gadgets</a>
</div>
<button onclick='verCarrito()' class='bg-orange-600 text-white px-4 py-2 rounded-xl'>🛒 <span id='contador'>0</span></button>
</nav>
<section class='hero text-white p-14'>
<h1 class='text-6xl font-bold'>Tecnología y Top Ventas</h1>
<p class='mt-4 text-xl'>Gaming, mascotas, hogar y productos virales</p>
</section>
<div class='max-w-7xl mx-auto p-8'>
<section id='pc'><h2 class='text-4xl font-bold mb-6'>🖥️ PC</h2><div id='pcprod' class='grid md:grid-cols-4 gap-6'></div></section>
<section id='gaming' class='mt-12'><h2 class='text-4xl font-bold mb-6'>🎮 Gaming</h2><div id='gameprod' class='grid md:grid-cols-4 gap-6'></div></section>
<section id='cafe' class='mt-12'><h2 class='text-4xl font-bold mb-6'>☕ Café</h2><div id='cafeprod' class='grid md:grid-cols-4 gap-6'></div></section>
<section id='mascotas' class='mt-12'><h2 class='text-4xl font-bold mb-6'>🐶 Mascotas</h2><div id='petprod' class='grid md:grid-cols-4 gap-6'></div></section>
<section id='gadgets' class='mt-12'><h2 class='text-4xl font-bold mb-6'>📱 Gadgets</h2><div id='gadprod' class='grid md:grid-cols-4 gap-6'></div></section>
</div>
<script>
let carrito=[];
const data={
pc:[['RTX Setup RGB',799],['Monitor Curvo Gaming',229],['SSD NVMe 2TB',129],['Webcam HD',45]],
gaming:[['Teclado Mecánico RGB',59],['Ratón Pro Gaming',35],['Silla Gaming',129],['Auriculares RGB',49]],
cafe:[['Cafetera Espresso',89],['Molinillo Café',39],['Espumador Leche',29],['Taza Inteligente',35]],
mascotas:[['Royal Canin Maxi',54],['Purina Pro Plan',49],['Cama Ortopédica',39],['Fuente Mascotas',27]],
gadgets:[['Mini Impresora',29],['Freidora Aire XL',79],['Robot Aspirador',149],['PowerBank 30000',39]]}
function card(n,p){return `<div class='product bg-white rounded-3xl shadow overflow-hidden'><img src='https://picsum.photos/400/300?random=${n}' class='h-52 w-full object-cover'><div class='p-5'><span class='bg-orange-600 text-white px-2 py-1 rounded-full'>TOP</span><h3 class='font-bold text-xl mt-2'>${n}</h3><p>⭐⭐⭐⭐⭐ (2.5k)</p><p class='text-3xl font-bold'>${p}€</p><button onclick="comprar('${n}',${p})" class='w-full bg-orange-600 text-white p-3 rounded-xl mt-3'>Añadir</button></div></div>`}
Object.entries(data).forEach(([k,v])=>v.forEach(x=>document.getElementById(k==='gaming'?'gameprod':k==='cafe'?'cafeprod':k==='mascotas'?'petprod':k==='gadgets'?'gadprod':'pcprod').innerHTML+=card(x[0],x[1])))
function comprar(n,p){carrito.push({n,p});contador.innerText=carrito.length}
function verCarrito(){alert(carrito.map(x=>x.n+' '+x.p+'€').join('\n')||'Carrito vacío')}
</script>
</body>
</html>
