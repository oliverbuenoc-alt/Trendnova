<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIN STORE</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
margin:0;
background:#f3f4f6;
font-family:Arial,sans-serif;
}
.card:hover{
transform:translateY(-5px);
transition:.3s;
}
</style>
</head>

<body>

<div class="bg-black text-white text-center p-3">
🔥 OFERTA FLASH · Envío gratis hoy · -50%
</div>

<div class="max-w-7xl mx-auto p-6">

<h1 class="text-5xl font-bold text-center">
WIN STORE
</h1>

<p class="text-center text-gray-500 mb-6">
Winning Products 2026
</p>

<div class="flex gap-3 overflow-auto mb-8">
<button class="bg-white p-2 rounded-xl">Todos</button>
<button class="bg-white p-2 rounded-xl">TikTok</button>
<button class="bg-white p-2 rounded-xl">Gaming</button>
<button class="bg-white p-2 rounded-xl">Tech</button>
</div>

<div id="productos"
class="grid md:grid-cols-4 gap-6"></div>

<div class="bg-white rounded-3xl p-8 mt-10 shadow">

<h2 class="text-2xl font-bold">
Métodos de pago
</h2>

<p>Stripe · PayPal · Tarjeta</p>

<h2 class="text-2xl font-bold mt-6">
Opiniones
</h2>

<p>"Me llegó en 5 días" ⭐⭐⭐⭐⭐</p>
<p>"Lo vi en TikTok y funciona" ⭐⭐⭐⭐⭐</p>

</div>

</div>

<script>

const productos=[

{
nombre:"Mini Proyector",
precio:"49€",
categoria:"Viral",
stock:"Quedan 7",
rating:"4.9 ⭐",
imagen:"https://images.unsplash.com/photo-1545239351-1141bd82e8a6?w=500"
},

{
nombre:"Smartwatch Ultra",
precio:"69€",
categoria:"Top ventas",
stock:"Quedan 4",
rating:"4.8 ⭐",
imagen:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
},

{
nombre:"Mini Impresora Bluetooth",
precio:"29€",
categoria:"TikTok",
stock:"Quedan 11",
rating:"4.9 ⭐",
imagen:"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500"
},

{
nombre:"Teclado RGB",
precio:"59€",
categoria:"Gaming",
stock:"Últimas unidades",
rating:"4.8 ⭐",
imagen:"https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?w=500"
}

];

const contenedor=document.getElementById("productos");

productos.forEach(p=>{

contenedor.innerHTML += `

<div class="card bg-white rounded-3xl overflow-hidden shadow-lg">

<img
src="${p.imagen}"
class="h-64 w-full object-cover"
>

<div class="p-5">

<div class="flex justify-between">

<span class="bg-red-500 text-white rounded-full px-3 py-1 text-sm">
${p.categoria}
</span>

<span>⏰23:59</span>

</div>

<h2 class="font-bold text-xl mt-3">
${p.nombre}
</h2>

<p>${p.rating}</p>

<p class="text-red-500">
${p.stock}
</p>

<div class="flex justify-between mt-4">

<div>
<p class="text-2xl font-bold">
${p.precio}
</p>

<p class="line-through text-gray-400">
99€
</p>
</div>

<button
class="bg-black text-white rounded-xl px-4">
Añadir
</button>

</div>

<button class="w-full bg-yellow-400 p-3 rounded-xl mt-4">
Comprar ahora
</button>

</div>

</div>

`

})

</script>

</body>
</html>
